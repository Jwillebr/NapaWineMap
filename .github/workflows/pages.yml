# Publishes the app by mirroring main to the gh-pages branch, which GitHub
# Pages serves. This avoids needing the repo's Pages source set to "GitHub
# Actions" — pushing gh-pages auto-enabled Pages with branch serving.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
